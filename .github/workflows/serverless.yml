name: Serbia Jobs Serverless
on:
  workflow_dispatch:
    inputs:
      action:
        description: Operation (stage preserves current bot; cutover switches it)
        type: choice
        options: [check, sources, deploy, stage, cutover, preview, collect, ads, pause, resume]
        default: check
      legacy_stopped:
        description: Render is suspended AND the old Check Serbia jobs workflow is disabled
        type: boolean
        default: false
  workflow_run:
    workflows: [Test bot]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: serbia-jobs-collection
  queue: max
  cancel-in-progress: false
jobs:
  cloud:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUD_MANAGEMENT_GATE: '1'
      CLOUD_REQUEST_INTERVAL: '2'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: serverless
      - name: Verify runtime and migration tests
        if: github.event_name != 'schedule'
        run: |
          node --test serverless/tests/*.test.js
          python3 -m unittest discover -s tests -q
      - name: Legacy staging operation
        if: inputs.action == 'stage' || inputs.action == 'cutover'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_PROBE_TOKEN }}
          SUPABASE_URL: https://iajwyuldjwptkbafpmgl.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUD_ACTION: ${{ inputs.action }}
          LEGACY_STOPPED: ${{ inputs.legacy_stopped }}
        run: |
          if [ "$CLOUD_ACTION" = 'cutover' ]; then
            test "$LEGACY_STOPPED" = 'true'
            python3 serverless/migrate.py cutover --legacy-stopped
          else
            python3 serverless/migrate.py stage
          fi
      - name: Run operation
        if: inputs.action != 'stage' && inputs.action != 'cutover'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_PROBE_TOKEN }}
          CLOUD_ACTION: ${{ (github.event_name == 'workflow_run' && 'deploy') || inputs.action || 'scheduled' }}
          LEGACY_STOPPED: ${{ inputs.legacy_stopped }}
        run: |
          case "$CLOUD_ACTION" in
            sources) python3 tools/check_sources.py ;;
            deploy)
              python3 serverless/deploy.py
              python3 serverless/refresh_facts.py
              # Screen diagnostics must not prevent collection after a safe deploy.
              python3 serverless/collect.py
              python3 serverless/health_check.py
              python3 serverless/operations_check.py
              python3 serverless/menu_check.py
              python3 serverless/notification_check.py
              ;;
            scheduled) python3 serverless/scheduled.py ;;
            collect)
              python3 serverless/collect.py
              python3 serverless/ads_worker.py
              ;;
            ads) python3 serverless/ads_worker.py ;;
            resume)
              if [ "$LEGACY_STOPPED" != 'true' ]; then
                echo 'Suspend Render and disable its old collector before final migration.'
                exit 1
              fi
              python3 serverless/migrate.py "$CLOUD_ACTION" --legacy-stopped
              python3 serverless/collect.py
              ;;
            check|preview|pause) python3 serverless/migrate.py "$CLOUD_ACTION" ;;
            *) exit 1 ;;
          esac
