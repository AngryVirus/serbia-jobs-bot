name: Test bot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - run: python3 -m unittest discover -s tests -v
      - run: node --test serverless/tests/*.test.js serverless-probe/tests/*.test.js
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install detect-secrets==1.5.0 pip-audit==2.9.0 # pragma: allowlist secret
      - run: python3 tools/check_secrets.py
      - run: python3 -m pip_audit -r requirements-dev.txt --progress-spinner off
      - run: npm audit --audit-level=low --prefix serverless
      - run: npm audit --audit-level=low --prefix serverless-probe
