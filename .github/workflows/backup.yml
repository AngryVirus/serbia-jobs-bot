name: Encrypted SQLite backup
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Serbia Jobs Serverless]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: serbia-jobs-collection
  queue: max
  cancel-in-progress: false
jobs:
  backup:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUD_MANAGEMENT_GATE: '1'
      CLOUD_REQUEST_INTERVAL: '2'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: serverless
      - name: Create encrypted snapshot and verify offline recovery
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_PROBE_TOKEN }}
        run: python3 serverless/backup.py create work/backup/runtime.sjcbk --attempts 3
      - name: Verify encrypted artifact and report belong together
        id: verified
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_PROBE_TOKEN }}
        run: python3 serverless/backup.py verify-pair work/backup/runtime.sjcbk
      - name: Save encrypted backup only
        if: steps.verified.conclusion == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-sqlite-${{ github.run_id }}
          path: |
            work/backup/runtime.sjcbk
            work/backup/runtime.report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Record successful artifact upload
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_PROBE_TOKEN }}
        run: python3 serverless/backup.py confirm work/backup/runtime.sjcbk
