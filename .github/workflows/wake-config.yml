name: Configure bot collection wake
on:
  workflow_dispatch:
    inputs:
      enabled:
        description: Enable only after approving and configuring the dedicated credential
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: serbia-jobs-collection
  queue: max
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: serverless
      - name: Configure private runtime credential
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_PROBE_TOKEN }}
          SJC_GITHUB_WAKE_TOKEN: ${{ secrets.SJC_GITHUB_WAKE_TOKEN }}
          SJC_WAKE_ENABLED: ${{ inputs.enabled }}
        run: python3 serverless/wake_config.py
