name: Independent bot watchdog
on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: serbia-jobs-watchdog
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUD_MANAGEMENT_PRIORITY: watchdog
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: serverless
      - run: python3 serverless/health_check.py
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_PROBE_TOKEN }}
