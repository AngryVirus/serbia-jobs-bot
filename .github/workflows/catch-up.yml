name: Catch up overdue collection
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Independent bot watchdog]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: serbia-jobs-collection
  queue: max
  cancel-in-progress: false
jobs:
  catch_up:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUD_MANAGEMENT_GATE: '1'
      CLOUD_REQUEST_INTERVAL: '2'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: serverless
      - name: Collect only when overdue
        run: python3 serverless/catch_up.py
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_PROBE_TOKEN }}
